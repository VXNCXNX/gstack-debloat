name: ci

# Proves the strip works against a real gstack install and STAYS clean across a
# regeneration. Runs on every push/PR, weekly (to catch upstream gstack drift),
# and on demand.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC — catch new gstack releases
  workflow_dispatch:

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gstack-debloat
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Clone latest gstack
        run: git clone --depth 1 https://github.com/garrytan/gstack.git "$RUNNER_TEMP/gstack"

      - name: Install gstack deps
        working-directory: ${{ runner.temp }}/gstack
        run: bun install

      - name: Record gstack version
        run: cat "$RUNNER_TEMP/gstack/VERSION" 2>/dev/null || echo "unknown"

      - name: Strip
        run: ./strip-telemetry.sh "$RUNNER_TEMP/gstack"

      - name: Check — clean after strip
        run: ./strip-telemetry.sh --check "$RUNNER_TEMP/gstack"

      - name: Idempotent — second strip is a no-op-equivalent and still exits 0
        run: ./strip-telemetry.sh "$RUNNER_TEMP/gstack"

      - name: Check — still clean after second strip
        run: ./strip-telemetry.sh --check "$RUNNER_TEMP/gstack"

      # --host all, not the bare default: it proves the patched sources render
      # clean for EVERY host (claude, codex/.agents, kiro, factory, ...), and it
      # materializes the host copies gstack's own suite reads. A fresh clone
      # ships none of them (they are gitignored), and the strip only refreshes
      # .agents when the user already has that host installed.
      - name: Regenerate skills from patched sources (every host)
        working-directory: ${{ runner.temp }}/gstack
        run: bun run gen:skill-docs --host all

      - name: Check — STILL clean after regeneration (sources are patched, not just output)
        run: ./strip-telemetry.sh --check "$RUNNER_TEMP/gstack"

      - name: Smoke — skills still render with frontmatter + non-trivial body
        working-directory: ${{ runner.temp }}/gstack
        run: |
          fail=0
          for f in ship/SKILL.md review/SKILL.md office-hours/SKILL.md; do
            [ -s "$f" ] || { echo "EMPTY: $f"; fail=1; continue; }
            head -1 "$f" | grep -q '^---$' || { echo "NO FRONTMATTER: $f"; fail=1; }
            [ "$(wc -l < "$f")" -ge 50 ] || { echo "TOO SHORT: $f"; fail=1; }
          done
          exit $fail

      - name: Test Codex startup paths and compact catalog after regeneration
        run: python3 tests/test_codex_startup.py "$RUNNER_TEMP/gstack"

      # gstack's own doc-generation and preamble-runtime suites must survive the
      # strip: they pin the STATUS-line contract and every render assertion the
      # patched sources feed. Upstream adding a test that asserts the noise turns
      # this red before a user hits it. The telemetry/learnings/timeline suites
      # are deliberately NOT run -- they exercise the binaries the strip stubs.
      - name: Test — gstack's doc-gen + skill-start suites stay green after the strip
        working-directory: ${{ runner.temp }}/gstack
        run: bun test test/gen-skill-docs.test.ts test/gstack-skill-start.test.ts
